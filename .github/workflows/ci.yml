name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (wasm feature)
        run: cargo clippy --all-targets --features wasm -- -D warnings
      - name: Clippy (python feature)
        run: cargo clippy --lib --features python -- -D warnings
      - name: Tests (unit + fuzz)
        run: cargo test

  golden:
    name: golden accuracy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache UniMorph deu
        id: unimorph
        uses: actions/cache@v5
        with:
          path: data/deu/unimorph
          key: unimorph-deu-v2
      - name: Fetch UniMorph deu
        if: steps.unimorph.outputs.cache-hit != 'true'
        run: ./scripts/deu/fetch_unimorph.sh
      - name: Golden harness with regression gate
        run: cargo run --release --bin golden -- --check
      - name: Cache Lefff fra
        id: lefff
        uses: actions/cache@v5
        with:
          path: data/fra/lefff.tsv
          key: lefff-fra-v1
      - name: Fetch Lefff fra
        if: steps.lefff.outputs.cache-hit != 'true'
        run: ./scripts/fra/fetch_lefff.sh
      - name: French golden harness with regression gate
        run: cargo run --release --bin golden_fra -- data/fra/lefff.tsv --check
      - name: Cache FreeLing spa
        id: freeling
        uses: actions/cache@v5
        with:
          path: data/spa/freeling.tsv
          key: freeling-spa-v1
      - name: Fetch FreeLing spa
        if: steps.freeling.outputs.cache-hit != 'true'
        run: ./scripts/spa/fetch_freeling.sh
      - name: Spanish golden harness with regression gate
        run: cargo run --release --bin golden_spa -- data/spa/freeling.tsv --check
      - name: Cache FreeLing cat
        id: freeling-cat
        uses: actions/cache@v5
        with:
          path: data/cat/freeling.tsv
          key: freeling-cat-v1
      - name: Fetch FreeLing cat
        if: steps.freeling-cat.outputs.cache-hit != 'true'
        run: ./scripts/cat/fetch_freeling.sh
      - name: Catalan golden harness with regression gate
        run: cargo run --release --bin golden_cat -- data/cat/freeling.tsv --check
      - name: Cache MorphoBr por
        id: morphobr
        uses: actions/cache@v5
        with:
          path: data/por/morphobr.tsv
          key: morphobr-por-v1
      - name: Fetch MorphoBr por
        if: steps.morphobr.outputs.cache-hit != 'true'
        run: ./scripts/por/fetch_morphobr.sh
      - name: Portuguese golden harness with regression gate
        run: cargo run --release --bin golden_por -- data/por/morphobr.tsv --check
      - name: Cache Morph-It ita
        id: morphit
        uses: actions/cache@v5
        with:
          path: data/ita/morphit.tsv
          key: morphit-ita-v1
      - name: Fetch Morph-It ita
        if: steps.morphit.outputs.cache-hit != 'true'
        run: ./scripts/ita/fetch_morphit.sh
      - name: Italian golden harness with regression gate
        run: cargo run --release --bin golden_ita -- data/ita/morphit.tsv --check
      - name: Cache AGID eng
        id: agid
        uses: actions/cache@v5
        with:
          path: data/eng/agid.tsv
          key: agid-eng-v1
      - name: Fetch AGID eng
        if: steps.agid.outputs.cache-hit != 'true'
        run: ./scripts/eng/fetch_agid.sh
      - name: English golden harness with regression gate
        run: cargo run --release --bin golden_eng -- data/eng/agid.tsv --check
      - name: Cache MorfFlex ces
        id: morfflex
        uses: actions/cache@v5
        with:
          path: data/ces/morfflex.tsv
          key: morfflex-ces-v1
      - name: Fetch MorfFlex ces
        if: steps.morfflex.outputs.cache-hit != 'true'
        run: ./scripts/ces/fetch_morfflex.sh
      - name: Czech golden harness with regression gate
        run: cargo run --release --bin golden_ces -- data/ces/morfflex.tsv --check
      - name: Cache Sloleks slv
        id: sloleks
        uses: actions/cache@v5
        with:
          path: data/slv/sloleks.tsv
          key: sloleks-slv-v1
      - name: Fetch Sloleks slv
        if: steps.sloleks.outputs.cache-hit != 'true'
        run: ./scripts/slv/fetch_sloleks.sh
      - name: Slovenian golden harness with regression gate
        run: cargo run --release --bin golden_slv -- data/slv/sloleks.tsv --check
      - name: Cache Apertium slv
        id: apertium-slv
        uses: actions/cache@v5
        with:
          path: data/slv/apertium.tsv
          key: apertium-slv-v1
      - name: Fetch Apertium slv
        if: steps.apertium-slv.outputs.cache-hit != 'true'
        run: ./scripts/slv/fetch_apertium.sh
      - name: Slovenian Sloleks-Apertium agreement gate
        run: cargo run --release --bin golden_slv -- data/slv/sloleks.tsv data/slv/apertium.tsv --check
      - name: Cache Vabamorf est
        id: vabamorf
        uses: actions/cache@v5
        with:
          path: data/est/vabamorf.tsv
          key: vabamorf-est-v1
      - name: Fetch Vabamorf est
        if: steps.vabamorf.outputs.cache-hit != 'true'
        run: ./scripts/est/fetch_vabamorf.sh
      - name: Estonian golden harness with regression gate
        run: cargo run --release --bin golden_est -- data/est/vabamorf.tsv --check
      - name: Cache Omorfi fin
        id: omorfi
        uses: actions/cache@v5
        with:
          path: data/fin/omorfi.tsv
          key: omorfi-fin-v1
      - name: Fetch Omorfi fin
        if: steps.omorfi.outputs.cache-hit != 'true'
        run: ./scripts/fin/fetch_omorfi.sh
      - name: Finnish golden harness with regression gate
        run: cargo run --release --bin golden_fin -- data/fin/omorfi.tsv --check
      - name: Cache BuNaMo gle
        id: bunamo
        uses: actions/cache@v5
        with:
          path: data/gle/bunamo.tsv
          key: bunamo-gle-v1
      - name: Fetch BuNaMo gle
        if: steps.bunamo.outputs.cache-hit != 'true'
        run: ./scripts/gle/fetch_bunamo.sh
      - name: Irish golden harness with regression gate
        run: cargo run --release --bin golden_gle -- data/gle/bunamo.tsv --check
      - name: Cache COR dan
        id: cor
        uses: actions/cache@v5
        with:
          path: data/dan/cor-verbs.tsv
          key: cor-dan-v1
      - name: Fetch COR dan
        if: steps.cor.outputs.cache-hit != 'true'
        run: ./scripts/dan/fetch_cor.sh
      - name: Danish golden harness with regression gate
        run: cargo run --release --bin golden_dan -- data/dan/cor-verbs.tsv --check
      - name: Cache dexonline ron
        id: dexonline
        uses: actions/cache@v5
        with:
          path: data/ron/dexonline.tsv
          key: dexonline-ron-v1
      - name: Fetch dexonline ron
        if: steps.dexonline.outputs.cache-hit != 'true'
        run: ./scripts/ron/fetch_dexonline.sh
      - name: Romanian golden harness with regression gate
        run: cargo run --release --bin golden_ron -- data/ron/dexonline.tsv --check
      - name: Cache SALDO swe
        id: saldo
        uses: actions/cache@v5
        with:
          path: data/swe/saldo.tsv
          key: saldo-swe-v1
      - name: Fetch SALDO swe
        if: steps.saldo.outputs.cache-hit != 'true'
        run: ./scripts/swe/fetch_saldo.sh
      - name: Swedish golden harness with regression gate
        run: cargo run --release --bin golden_swe -- data/swe/saldo.tsv --check
      - name: Cache VESUM ukr
        id: vesum-ukr
        uses: actions/cache@v5
        with:
          path: data/ukr/vesum.tsv
          key: vesum-ukr-v1
      - name: Fetch VESUM ukr
        if: steps.vesum-ukr.outputs.cache-hit != 'true'
        run: ./scripts/ukr/fetch_vesum.sh
      - name: Cache kaikki ukr
        id: kaikki-ukr
        uses: actions/cache@v5
        with:
          path: data/ukr/kaikki.tsv
          key: kaikki-ukr-v1
      - name: Fetch kaikki ukr
        if: steps.kaikki-ukr.outputs.cache-hit != 'true'
        run: ./scripts/ukr/fetch_kaikki.sh
      - name: Ukrainian golden harness with two-oracle regression gate
        run: cargo run --release --bin golden_ukr -- data/ukr/vesum.tsv data/ukr/kaikki.tsv --check
      - name: Cache BÍN isl
        id: bin-isl
        uses: actions/cache@v5
        with:
          path: data/isl/bin.tsv
          key: bin-isl-v1
      - name: Fetch BÍN isl
        if: steps.bin-isl.outputs.cache-hit != 'true'
        run: ./scripts/isl/fetch_bin.sh
      - name: Icelandic golden harness with regression gate
        run: cargo run --release --bin golden_isl -- data/isl/bin.tsv --check
      - name: Cache IPADIC jpn
        id: ipadic
        uses: actions/cache@v5
        with:
          path: data/jpn/ipadic.tsv
          key: ipadic-jpn-v1
      - name: Fetch IPADIC jpn
        if: steps.ipadic.outputs.cache-hit != 'true'
        run: ./scripts/jpn/fetch_ipadic.sh
      - name: Cache kaikki jpn
        id: kaikki-jpn
        uses: actions/cache@v5
        with:
          path: data/jpn/kaikki.tsv
          key: kaikki-jpn-v1
      - name: Fetch kaikki jpn
        if: steps.kaikki-jpn.outputs.cache-hit != 'true'
        run: ./scripts/jpn/fetch_kaikki.sh
      # Japanese is lexicon-bound (the inflection class is not derivable
      # from the surface), so it is scored on the two-oracle agreement
      # rather than a single full-vocabulary oracle.
      - name: Japanese golden harness with regression gate
        run: cargo run --release --bin golden_jpn -- data/jpn/ipadic.tsv data/jpn/kaikki.tsv --check
      - name: Cache krdict kor
        id: krdict
        uses: actions/cache@v5
        with:
          path: data/kor/krdict.tsv
          key: krdict-kor-v1
      - name: Fetch krdict kor
        if: steps.krdict.outputs.cache-hit != 'true'
        run: ./scripts/kor/fetch_krdict.sh
      - name: Cache kaikki kor
        id: kaikki-kor
        uses: actions/cache@v5
        with:
          path: data/kor/kaikki.tsv
          key: kaikki-kor-v1
      - name: Fetch kaikki kor
        if: steps.kaikki-kor.outputs.cache-hit != 'true'
        run: ./scripts/kor/fetch_kaikki.sh
      - name: Korean golden harness with regression gate (two-oracle agreement)
        run: cargo run --release --bin golden_kor -- data/kor/krdict.tsv data/kor/kaikki.tsv --check
      - name: Cache kaikki nld
        id: kaikki-nld
        uses: actions/cache@v5
        with:
          path: data/nld/kaikki.tsv
          key: kaikki-nld-v1
      - name: Fetch kaikki nld
        if: steps.kaikki-nld.outputs.cache-hit != 'true'
        run: ./scripts/nld/fetch_kaikki.sh
      - name: Cache Apertium nld
        id: apertium-nld
        uses: actions/cache@v5
        with:
          path: data/nld/apertium.tsv
          key: apertium-nld-v1
      - name: Fetch Apertium nld
        if: steps.apertium-nld.outputs.cache-hit != 'true'
        run: ./scripts/nld/fetch_apertium.sh
      - name: Dutch kaikki-Apertium agreement gate
        run: cargo run --release --bin golden_nld -- data/nld/apertium.tsv data/nld/kaikki.tsv --check
      - name: Cache OpenCorpora rus
        id: opencorpora
        uses: actions/cache@v5
        with:
          path: data/rus/opencorpora.tsv
          key: opencorpora-rus-v1
      - name: Fetch OpenCorpora rus
        if: steps.opencorpora.outputs.cache-hit != 'true'
        run: ./scripts/rus/fetch_opencorpora.sh
      - name: Russian golden harness with regression gate
        run: cargo run --release --bin golden_rus -- data/rus/opencorpora.tsv --check
      - name: Cache UniMorph hye
        id: unimorph-hye
        uses: actions/cache@v5
        with:
          path: data/hye/unimorph.tsv
          key: unimorph-hye-v1
      - name: Fetch UniMorph hye
        if: steps.unimorph-hye.outputs.cache-hit != 'true'
        run: ./scripts/hye/fetch_unimorph.sh
      - name: Cache uniparser hye
        id: uniparser-hye
        uses: actions/cache@v5
        with:
          path: data/hye/uniparser.tsv
          key: uniparser-hye-v1
      - name: Fetch uniparser hye
        if: steps.uniparser-hye.outputs.cache-hit != 'true'
        run: ./scripts/hye/fetch_uniparser.sh
      - name: Armenian UniMorph-uniparser agreement gate
        run: cargo run --release --bin golden_hye -- data/hye/uniparser.tsv data/hye/unimorph.tsv --check
      - name: Cache UniMorph tur
        id: unimorph-tur
        uses: actions/cache@v5
        with:
          path: data/tur/unimorph.tsv
          key: unimorph-tur-v1
      - name: Fetch UniMorph tur
        if: steps.unimorph-tur.outputs.cache-hit != 'true'
        run: ./scripts/tur/fetch_unimorph.sh
      - name: Cache kaikki tur
        id: kaikki-tur
        uses: actions/cache@v5
        with:
          path: data/tur/kaikki.tsv
          key: kaikki-tur-v1
      - name: Fetch kaikki tur
        if: steps.kaikki-tur.outputs.cache-hit != 'true'
        run: ./scripts/tur/fetch_kaikki.sh
      - name: Turkish kaikki-UniMorph agreement gate
        run: cargo run --release --bin golden_tur -- data/tur/kaikki.tsv data/tur/unimorph.tsv --check
      - name: Cache kaikki hin
        id: kaikki-hin
        uses: actions/cache@v5
        with:
          path: data/hin/kaikki.tsv
          key: kaikki-hin-v1
      - name: Fetch kaikki hin
        if: steps.kaikki-hin.outputs.cache-hit != 'true'
        run: ./scripts/hin/fetch_kaikki.sh
      - name: Cache UniMorph hin
        id: unimorph-hin
        uses: actions/cache@v5
        with:
          path: data/hin/unimorph.tsv
          key: unimorph-hin-v1
      - name: Fetch UniMorph hin
        if: steps.unimorph-hin.outputs.cache-hit != 'true'
        run: ./scripts/hin/fetch_unimorph.sh
      - name: Hindi kaikki-UniMorph agreement gate
        run: cargo run --release --bin golden_hin -- data/hin/kaikki.tsv data/hin/unimorph.tsv --check
      - name: Cache UniMorph swc
        id: unimorph-swc
        uses: actions/cache@v5
        with:
          path: data/swa/swc.tsv
          key: unimorph-swc-v1
      - name: Fetch UniMorph swc
        if: steps.unimorph-swc.outputs.cache-hit != 'true'
        run: ./scripts/swa/fetch_unimorph.sh
      - name: Cache kaikki swa
        id: kaikki-swa
        uses: actions/cache@v5
        with:
          path: data/swa/kaikki.tsv
          key: kaikki-swa-v1
      - name: Fetch kaikki swa
        if: steps.kaikki-swa.outputs.cache-hit != 'true'
        run: ./scripts/swa/fetch_kaikki.sh
      - name: Swahili swc-kaikki agreement gate
        run: cargo run --release --bin golden_swa -- data/swa/swc.tsv data/swa/kaikki.tsv --check
      - name: Install foma (ThamizhiMorph FST toolchain for tam)
        run: sudo apt-get update && sudo apt-get install -y foma-bin
      - name: Cache kaikki tam
        id: kaikki-tam
        uses: actions/cache@v5
        with:
          path: data/tam/kaikki.tsv
          key: kaikki-tam-v1
      - name: Fetch kaikki tam
        if: steps.kaikki-tam.outputs.cache-hit != 'true'
        run: ./scripts/tam/fetch_kaikki.sh
      - name: Cache ThamizhiMorph tam
        id: thamizhi-tam
        uses: actions/cache@v5
        with:
          path: data/tam/thamizhi.tsv
          key: thamizhi-tam-v1
      - name: Fetch ThamizhiMorph tam
        if: steps.thamizhi-tam.outputs.cache-hit != 'true'
        run: ./scripts/tam/fetch_thamizhi.sh
      - name: Tamil kaikki-ThamizhiMorph agreement gate (two-oracle)
        run: cargo run --release --bin golden_tam -- data/tam/thamizhi.tsv data/tam/kaikki.tsv --check
      - name: Cache UniMorph tel
        id: unimorph-tel
        uses: actions/cache@v5
        with:
          path: data/tel/unimorph.tsv
          key: unimorph-tel-v1
      - name: Fetch UniMorph tel
        if: steps.unimorph-tel.outputs.cache-hit != 'true'
        run: ./scripts/tel/fetch_unimorph.sh
      # Telugu is scored against UniMorph alone: kaikki tabulates only a
      # dozen verbs (one shared with UniMorph), too few for an agreement
      # gate — see docs/tel/oracles.md.
      - name: Telugu golden harness with regression gate
        run: cargo run --release --bin golden_tel -- data/tel/unimorph.tsv --check
      - name: Cache UniMorph kan
        id: unimorph-kan
        uses: actions/cache@v5
        with:
          path: data/kan/unimorph.tsv
          key: unimorph-kan-v1
      - name: Fetch UniMorph kan
        if: steps.unimorph-kan.outputs.cache-hit != 'true'
        run: ./scripts/kan/fetch_unimorph.sh
      - name: Cache kaikki kan
        id: kaikki-kan
        uses: actions/cache@v5
        with:
          path: data/kan/kaikki.tsv
          key: kaikki-kan-v1
      - name: Fetch kaikki kan
        if: steps.kaikki-kan.outputs.cache-hit != 'true'
        run: ./scripts/kan/fetch_kaikki.sh
      - name: Kannada UniMorph-kaikki agreement gate (two-oracle)
        run: cargo run --release --bin golden_kan -- data/kan/unimorph.tsv data/kan/kaikki.tsv --check
      - name: Cache UniMorph tgl
        id: unimorph-tgl
        uses: actions/cache@v5
        with:
          path: data/tgl/unimorph.tsv
          key: unimorph-tgl-v1
      - name: Fetch UniMorph tgl
        if: steps.unimorph-tgl.outputs.cache-hit != 'true'
        run: ./scripts/tgl/fetch_unimorph.sh
      - name: Cache kaikki tgl
        id: kaikki-tgl
        uses: actions/cache@v5
        with:
          path: data/tgl/kaikki.tsv
          key: kaikki-tgl-v1
      - name: Fetch kaikki tgl
        if: steps.kaikki-tgl.outputs.cache-hit != 'true'
        run: ./scripts/tgl/fetch_kaikki.sh
      - name: Tagalog UniMorph-kaikki agreement gate
        run: cargo run --release --bin golden_tgl -- data/tgl/kaikki.tsv data/tgl/unimorph.tsv --check
      - name: Cache kaikki pes
        id: kaikki-pes
        uses: actions/cache@v5
        with:
          path: data/pes/kaikki.tsv
          key: kaikki-pes-v1
      - name: Fetch kaikki pes
        if: steps.kaikki-pes.outputs.cache-hit != 'true'
        run: ./scripts/pes/fetch_kaikki.sh
      - name: Install lttoolbox (apertium-pes oracle)
        run: sudo apt-get update && sudo apt-get install -y lttoolbox
      - name: Fetch apertium-pes (second oracle)
        run: ./scripts/pes/fetch_apertium.sh
      - name: Persian kaikki-apertium agreement gate (two-oracle)
        run: cargo run --release --bin golden_pes -- data/pes/kaikki.tsv data/pes/apertium.tsv --check
      - name: Cache UniMorph guj
        id: unimorph-guj
        uses: actions/cache@v5
        with:
          path: data/guj/unimorph.tsv
          key: unimorph-guj-v1
      - name: Fetch UniMorph guj
        if: steps.unimorph-guj.outputs.cache-hit != 'true'
        run: ./scripts/guj/fetch_unimorph.sh
      # Gujarati is scored against UniMorph alone: kaikki guj is the same
      # English-Wiktionary lineage (the gu-conj template), not an
      # independent agreement partner — see docs/guj/oracles.md. kaikki is
      # a separate spot check.
      - name: Gujarati golden harness with regression gate
        run: cargo run --release --bin golden_guj -- data/guj/unimorph.tsv --check
      - name: Reverse-lookup gate (fra, spa, eng; deu needs the kaikki dump)
        run: cargo run --release --bin reverse_gate -- --check --langs fra,spa,eng
