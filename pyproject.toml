[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "ablaut"
description = "A fast, correct German verb conjugator"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.11"
keywords = ["german", "conjugation", "morphology", "nlp", "linguistics"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Text Processing :: Linguistic",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/v4nn4/ablaut"

[tool.maturin]
features = ["python"]
