[package]
name = "ablaut"
version = "0.9.0"
edition = "2021"
rust-version = "1.75"
description = "Fast, correct verb conjugation for 20+ languages, each verified against two independent gold lexicons"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ablaut-dev/ablaut"
keywords = ["conjugation", "morphology", "nlp", "linguistics", "language"]
categories = ["text-processing"]

include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "src/**/*.rs",
    "data/cat/verbs.tsv",
    "data/nld/verbs.tsv",
    "data/rus/verbs.tsv",
    "data/ces/aspect.tsv",
    "data/ces/classes.tsv",
    "data/ces/verbs.tsv",
    "data/dan/auxiliaries.tsv",
    "data/dan/parts.tsv",
    "data/deu/verbs.tsv",
    "data/eng/verbs.tsv",
    "data/est/verbs.tsv",
    "data/fin/verbs.tsv",
    "data/fra/verbs.tsv",
    "data/gle/verbs.tsv",
    "data/guj/verbs.tsv",
    "data/hin/verbs.tsv",
    "data/hye/verbs.tsv",
    "data/isl/verbs.tsv",
    "data/ita/auxiliaries.tsv",
    "data/ita/classes.tsv",
    "data/ita/strong.tsv",
    "data/ita/verbs.tsv",
    "data/jpn/verbs.tsv",
    "data/kor/verbs.tsv",
    "data/por/classes.tsv",
    "data/por/verbs.tsv",
    "data/ron/classes.tsv",
    "data/ron/verbs.tsv",
    "data/slv/classes.tsv",
    "data/slv/verbs.tsv",
    "data/spa/classes.tsv",
    "data/spa/verbs.tsv",
    "data/swa/verbs.tsv",
    "data/swe/parts.tsv",
    "data/tam/verbs.tsv",
    "data/tel/verbs.tsv",
    "data/tgl/verbs.tsv",
    "data/tur/verbs.tsv",
    "data/ukr/verbs.tsv",
]

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"], optional = true }

[features]
serde = ["dep:serde"]
wasm = ["dep:wasm-bindgen", "serde", "dep:serde-wasm-bindgen"]
python = ["dep:pyo3"]

[dev-dependencies]
proptest = "1"
