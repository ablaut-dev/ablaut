[package]
name = "ablaut"
version = "0.6.0"
edition = "2021"
rust-version = "1.75"
description = "Fast, correct verb conjugation for 14 European languages, each verified against two independent gold lexicons"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ablaut-dev/ablaut"
keywords = ["conjugation", "morphology", "nlp", "linguistics", "language"]
categories = ["text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"], optional = true }

[features]
serde = ["dep:serde"]
wasm = ["dep:wasm-bindgen", "serde", "dep:serde-wasm-bindgen"]
python = ["dep:pyo3"]

[dev-dependencies]
proptest = "1"
