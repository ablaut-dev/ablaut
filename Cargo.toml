[package]
name = "ablaut"
version = "0.1.0"
edition = "2021"
description = "A fast, correct German verb conjugator grounded in the linguistics of German inflection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/v4nn4/ablaut"
keywords = ["german", "conjugation", "morphology", "nlp", "linguistics"]
categories = ["text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[features]
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde-wasm-bindgen"]
